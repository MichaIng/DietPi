name: utm
on: workflow_dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test_import:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download image
        run: |
          case '${{ runner.arch }}' in
            'ARM64') arch='UEFI-ARMv8';;
            'X64') arch='x86_64';;
          esac
          curl -sSfLO "https://dietpi.com/downloads/images/testing/DietPi_UTM-$arch-Trixie.tar.xz"
          tar xf DietPi_UTM-$arch-Trixie.tar.xz
      - run: brew install --cask utm
      - name: Import
        run: |
          plutil -lint "DietPi_UTM-$arch-Trixie.utm/config.plist" # syntax check first
          read -r uuid < <(/usr/libexec/PlistBuddy -c 'Print :Information:UUID' "DietPi_UTM-$arch-Trixie.utm/config.plist")
          open -a UTM "DietPi_UTM-$arch-Trixie.utm"
          sleep 15
          utmctl list | tee list.txt
          grep -i "$uuid" list.txt
          utmctl status "$uuid" # expect "stopped"
